[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe2boltz"
version = "0.1.0"
description = "A robust converter from Quantum Espresso XML to BoltzTraP inputs, with full spin-polarization support."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "lxml>=4.9.0",
    "typer>=0.9.0",
]

[project.scripts]
qe2boltz = "qe2boltz.cli:app"
